[project]
name = "tarot-vid-tools"
version = "0.1.0"
description = "Context-aware automated subtitle to YouTube chapter generator for tarot and oracle readings."
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14,< 3.15"
dependencies = [
    "pysrt (>=1.1.2,<2.0.0)",
    "click (>=8.1.7,<9.0.0)",
    "openai-whisper (>=20250625,<20250626)",
    "torch (>=2.14.1,<3.0.0)",
    "pyobjc-framework-cocoa (>=12.2.2,<13.0.0)",
    "pyobjc-framework-vision (>=12.2.2,<13.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "faster-whisper (>=1.2.1,<2.0.0)",
    "google-genai (>=2.33.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "tarot_vid_tools", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)"
]

[tool.poetry.scripts]
tarot-chapters = "tarot_vid_tools.generator:main"

[tool.black]
line-length = 120
target-version = ['py314']

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:pysrt.*"
]

